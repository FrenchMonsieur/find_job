security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Un seul utilisateur : toi
    providers:
        users_in_memory:
            memory:
                users:
                    bou: { password: '%env(APP_PASSWORD_HASH)%', roles: ['ROLE_USER'] }

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: users_in_memory

            # Connexion par formulaire
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_offre

            logout:
                path: app_logout

            # Anti-force brute : 5 essais ratés = bloqué 15 minutes
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    # Qui a le droit d'aller où (la première règle qui correspond gagne)
    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }   # la page de connexion est ouverte à tous
        - { path: ^/, roles: ROLE_USER }            # tout le reste : connecté obligatoire

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
